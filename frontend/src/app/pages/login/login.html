<section class="login-page">
  <form [formGroup]="form" (ngSubmit)="submit()" class="login-card">
    <header class="login-header">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
          <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27" />
        </svg>
      </div>
      <h1>Central de Vitalidade</h1>
      <p>Bem-vindo! Faça login para continuar.</p>
    </header>

    <div class="login-fields">
      <label for="name">Nome de Usuário</label>
      <input id="name" formControlName="name" type="text" class="login-input" />

      <label for="password">Senha</label>
      <input id="password" formControlName="password" type="password" class="login-input" />
    </div>

    @if (error()) {
      <p class="login-error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="isLoading()" class="login-submit">
      @if (isLoading()) { Entrando... } @else { Entrar }
    </button>
  </form>
</section>
