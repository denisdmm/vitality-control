<div class="flex h-dvh">
  <!-- Sidebar fixa: desktop -->
  <aside
    class="hidden w-60 shrink-0 border-r bg-sidebar text-sidebar-foreground md:flex md:flex-col"
  >
    <app-nav-panel [items]="visibleMenu()" [user]="user()" />
  </aside>

  <!-- Drawer: abaixo de 768px, o mesmo menu por cima do conteúdo -->
  @if (drawerOpen()) {
    <div class="fixed inset-0 z-40 bg-black/50 md:hidden" (click)="closeDrawer()"></div>
    <aside
      class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col border-r bg-sidebar text-sidebar-foreground md:hidden"
    >
      <app-nav-panel
        [items]="visibleMenu()"
        [user]="user()"
        [closable]="true"
        (navigated)="closeDrawer()"
        (closed)="closeDrawer()" />
    </aside>
  }

  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-30 flex h-16 items-center gap-2 border-b bg-card px-4 sm:gap-4 sm:px-6">
      <button
        type="button"
        (click)="openDrawer()"
        class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-input bg-background text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground md:hidden"
        aria-label="Abrir menu"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      @if (backTo()) {
        <button
          type="button"
          (click)="goBack()"
          class="inline-flex h-9 shrink-0 items-center gap-1 rounded-md border border-input bg-background px-3 text-sm text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg>
          <span class="hidden sm:inline">Voltar</span>
        </button>
      }

      <h1 class="min-w-0 flex-1 truncate text-base font-semibold tracking-tight sm:text-lg">{{ pageTitle() }}</h1>

      @if (isPatient()) {
        <app-health-entry-modal />
      }

      <button
        type="button"
        (click)="logout()"
        class="inline-flex h-9 shrink-0 items-center justify-center rounded-md border border-input bg-background px-3 text-sm text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground"
      >
        Sair
      </button>
    </header>

    <!-- Content -->
    <main class="min-w-0 flex-1 overflow-x-hidden overflow-y-auto p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>
</div>
