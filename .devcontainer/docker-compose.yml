services:

  vitality_app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/vitality-control:cached

    command: sleep infinity

    depends_on:
      postgres-vitality:
        condition: service_healthy

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword

  postgres-vitality:
    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword

    volumes:
      - postgres-vitality:/var/lib/postgresql/data

    ports:
      - "5434:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U appuser -d appdb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-vitality: